<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code — Impormasyon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .loading {
            color: #7f8c8d;
            font-style: italic;
        }
        .data-row {
            background: #f8f9fa;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            text-align: left;
        }
        .label {
            font-weight: bold;
            color: #2c3e50;
            display: block;
            font-size: 0.9rem;
            margin-bottom: 3px;
        }
        .value {
            color: #34495e;
            font-size: 1rem;
        }
        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fdeaea;
            border-radius: 8px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📋</div>
        <h1>Impormasyon mula sa QR Code</h1>
        
        <div id="content">
            <p class="loading">🔄 Naglo-load ng impormasyon...</p>
        </div>

        <div class="footer">
            Online Barcode System
        </div>
    </div>

    <script>
        // ==============================================
        // 👇 ILAGAY MO DITO ANG IYONG GOOGLE SHEET ID
        // ==============================================
        const GOOGLE_SHEET_ID = "ILAGAY_ANG_SHEET_ID_MO_DITO";
        // ==============================================

        // Kunin ang QR ID mula sa link (halimbawa: ?id=001)
        const params = new URLSearchParams(window.location.search);
        const qrId = params.get('id');

        const contentDiv = document.getElementById('content');

        if (!qrId) {
            contentDiv.innerHTML = `
                <p class="error">⚠️ Walang nakitang QR ID sa link.</p>
                <p style="margin-top:15px; color:#7f8c8d; font-size:0.9rem;">Gamitin ang link mula sa QR code.</p>
            `;
        } else {
            // I-fetch ang data mula sa Google Sheet (published bilang CSV)
            const sheetUrl = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/pub?output=csv`;

            fetch(sheetUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Hindi mabuksan ang Google Sheet");
                    return response.text();
                })
                .then(csvText => {
                    // I-parse ang CSV
                    const rows = csvText.trim().split('\n').map(row => {
                        // Simpleng paghiwalay — pwede i-adjust kung may comma sa loob ng data
                        return row.split(',').map(cell => cell.trim().replace(/^"|"$/g, ''));
                    });

                    const headers = rows[0];
                    let found = false;

                    // Hanapin ang row na tumutugma sa QR ID
                    for (let i = 1; i < rows.length; i++) {
                        if (rows[i][0] === qrId) {
                            found = true;
                            let html = '';
                            for (let j = 0; j < headers.length; j++) {
                                html += `
                                    <div class="data-row">
                                        <span class="label">${headers[j]}</span>
                                        <span class="value">${rows[i][j]}</span>
                                    </div>
                                `;
                            }
                            contentDiv.innerHTML = html;
                            break;
                        }
                    }

                    if (!found) {
                        contentDiv.innerHTML = `
                            <p class="error">❌ Hindi nakita ang ID: <strong>${qrId}</strong></p>
                            <p style="margin-top:15px; color:#7f8c8d; font-size:0.9rem;">Siguraduhin na tama ang ID sa Google Sheet.</p>
                        `;
                    }
                })
                .catch(error => {
                    contentDiv.innerHTML = `
                        <p class="error">❌ May naganap na error:</p>
                        <p style="color:#e74c3c; font-size:0.9rem;">${error.message}</p>
                        <p style="margin-top:10px; color:#7f8c8d; font-size:0.85rem;">
                            Siguraduhin na: <br>
                            ✅ Nai-publish na ang Sheet sa web<br>
                            ✅ Pampubliko ang access (Anyone with link)
                        </p>
                    `;
                });
        }
    </script>
</body>
</html>
